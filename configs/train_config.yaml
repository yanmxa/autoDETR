# Training Configuration

model:
  hidden_dim: 512
  num_heads: 8
  num_layers: 3
  dropout: 0.1
  pretrained: true

training:
  epochs: 50
  batch_size: 32
  learning_rate: 1e-4
  weight_decay: 0.01

  # Scheduler
  scheduler: cosine
  warmup_epochs: 5

data:
  image_size: 224
  train_split: 0.8
  num_workers: 4

  # Data augmentation
  augmentation:
    horizontal_flip: 0.5
    rotation: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1

logging:
  log_dir: logs
  checkpoint_dir: checkpoints
  save_frequency: 5
  tensorboard: true
